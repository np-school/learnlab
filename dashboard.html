<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>หน้าแรก – NP-LearnLab</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/favicon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="shared/styles.css" rel="stylesheet">
<script src="https://unpkg.com/lucide@1.24.0"></script>
<style>
  .profile-card{display:flex;align-items:center;gap:16px;background:linear-gradient(135deg,var(--accent),var(--accent-dark));border-radius:18px;padding:20px 22px;color:#fff;margin-bottom:22px;flex-wrap:wrap;}
  .profile-avatar{width:64px;height:64px;border-radius:50%;border:2.5px solid rgba(255,255,255,.55);object-fit:cover;background:rgba(255,255,255,.18);flex-shrink:0;}
  .profile-name{font-size:18px;font-weight:800;}
  .profile-meta{font-size:12.5px;color:rgba(255,255,255,.85);margin-top:3px;}

  .stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:24px;}
  .stat-card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;text-decoration:none;transition:box-shadow .15s,transform .15s;}
  .stat-card:hover{box-shadow:0 8px 20px rgba(0,0,0,.08);transform:translateY(-2px);}
  .stat-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .stat-count{font-size:26px;font-weight:800;color:var(--text);line-height:1;}
  .stat-label{font-size:12px;color:var(--text2);font-weight:700;}
  .stat-card.a .stat-icon{background:var(--c-sky-pale);color:var(--c-sky-deep);}
  .stat-card.b .stat-icon{background:var(--c-green-pale);color:var(--c-green-deep);}
  .stat-card.c .stat-icon{background:var(--c-amber-pale);color:var(--c-amber-deep);}

  .dash-panel{background:#fff;border:1px solid var(--border);border-radius:18px;padding:20px 20px 22px;}
  .dash-panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px;}
  .dash-panel-title{font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px;}
  .dash-panel-link{font-size:12.5px;font-weight:700;color:var(--accent);text-decoration:none;display:flex;align-items:center;gap:4px;white-space:nowrap;}

  .course-row{display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid var(--border-soft);}
  .course-row:last-child{border-bottom:none;padding-bottom:0;}
  .course-row-icon{width:40px;height:40px;border-radius:11px;background:var(--accent-tint);color:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .course-row-body{flex:1;min-width:0;}
  .course-row-title{font-weight:700;font-size:13.5px;}
  .course-row-sub{font-size:11.5px;color:var(--text2);margin-top:2px;}
  .course-row-progress{width:110px;flex-shrink:0;}
  .course-row-progress .pct{font-size:11px;color:var(--text3);text-align:left;margin-top:4px;}

  @media (max-width:900px){.stat-grid{grid-template-columns:repeat(1,1fr);}}
</style>
</head>
<body>

<div id="loadingOverlay"><div class="spinner"></div><p style="color:var(--text2);font-size:14px;font-weight:700;">กำลังตรวจสอบสิทธิ์...</p></div>
<script>if(sessionStorage.getItem("nplab_profile")){document.getElementById("loadingOverlay").classList.add("hide");}</script>
<div id="toast"></div>

<div class="navbar blue"><div class="navbar-inner">
  <div class="navbar-brand">
    <button class="navbar-menu-btn" id="navMenuBtn" title="เมนู" onclick="toggleSidebar(event)"><i data-lucide="menu" style="width:18px;height:18px"></i></button>
    <img src="assets/logo-mark.png" alt="NP-LearnLab" class="navbar-mark-img">
    <div><div class="navbar-title">NP-LearnLab</div><div class="navbar-subtitle">ผู้ใช้ทั่วไป</div></div>
  </div>
  <div class="navbar-user" id="navbarUser"><span id="userLabel"></span><img id="userAvatar" class="navbar-avatar" alt="บัญชีผู้ใช้"><button class="navbar-logout" onclick="signOutUser()" title="ออกจากระบบ"><i data-lucide="log-out" style="width:16px;height:16px"></i></button></div>
</div></div>

<div id="sidebarOverlay" onclick="closeSidebar()"></div>
<div class="shell">
  <div class="sidebar" id="sidebar"></div>
  <script>try{if(localStorage.getItem('nplab_sidebar_collapsed')==='1')document.getElementById('sidebar').classList.add('collapsed');}catch(e){}</script>
  <div class="content">
    <div class="page-header">
      <div class="page-title">หน้าแรก</div>
      <div class="page-sub">ภาพรวมการอบรมและความคืบหน้าของคุณ</div>
    </div>

    <div class="profile-card" id="profileCard"></div>

    <div class="stat-grid">
      <a class="stat-card a" href="my-courses.html">
        <div class="stat-icon"><i data-lucide="book-marked" style="width:18px;height:18px"></i></div>
        <div class="stat-count" id="statEnrolled">0</div>
        <div class="stat-label">หลักสูตรที่สมัคร</div>
      </a>
      <a class="stat-card b" href="my-courses.html">
        <div class="stat-icon"><i data-lucide="check-circle-2" style="width:18px;height:18px"></i></div>
        <div class="stat-count" id="statDone">0</div>
        <div class="stat-label">เรียนจบแล้ว</div>
      </a>
      <a class="stat-card c" href="courses.html">
        <div class="stat-icon"><i data-lucide="compass" style="width:18px;height:18px"></i></div>
        <div class="stat-count" id="statAvailable">0</div>
        <div class="stat-label">หลักสูตรเปิดรับสมัคร</div>
      </a>
    </div>

    <div class="dash-panel">
      <div class="dash-panel-head">
        <div class="dash-panel-title"><i data-lucide="hourglass" style="width:17px;height:17px;color:var(--accent)"></i>กำลังเรียนอยู่</div>
        <a class="dash-panel-link" href="my-courses.html">ดูทั้งหมด <i data-lucide="chevron-right" style="width:14px;height:14px"></i></a>
      </div>
      <div id="inProgressList"></div>
      <div id="inProgressEmpty" class="empty-state" style="display:none;">
        <i data-lucide="inbox" style="width:30px;height:30px;margin-bottom:8px;"></i>
        <div>ยังไม่มีหลักสูตรที่กำลังเรียน — ลองดู "หลักสูตรการอบรมทั้งหมด"</div>
      </div>
    </div>

  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
<script src="shared/firebase-init.js"></script>
<script src="shared/auth-guard.js"></script>
<script src="shared/menu.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
