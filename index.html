<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NP-LearnLab — อบรมออนไลน์</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://unpkg.com/lucide@1.24.0"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-functions-compat.js"></script>
<script src="js/firebase-config.js"></script>
</head>
<body>

<div id="signinScreen" style="min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;">
  <h1 style="font-size:22px;">NP-LearnLab</h1>
  <p style="color:var(--ink-soft);font-size:13.5px;">ระบบอบรมออนไลน์ของโรงเรียน — ล็อกอินด้วยอีเมลโรงเรียน</p>
  <button class="btn btn-brass" onclick="doSignIn()">เข้าสู่ระบบด้วย Google</button>
  <p id="signinError" style="color:var(--rust);font-size:13px;display:none;"></p>
</div>

<div id="appShell" class="lab-shell" style="display:none;">
  <aside class="lab-rail">
    <div class="brand">NP-LearnLab<small id="userLabel"></small></div>
    <nav>
      <a class="tab active" href="#">หลักสูตรอบรม</a>
      <a class="tab" href="verify.html" target="_blank">ตรวจสอบเกียรติบัตร</a>
    </nav>
    <div class="rail-foot"><a href="#" onclick="auth.signOut();return false;" style="color:#C9C3B4;">ออกจากระบบ</a></div>
  </aside>
  <main class="lab-main">
    <div class="page-head">
      <h1>หลักสูตรอบรมออนไลน์</h1>
      <p>เรียนเนื้อหาให้ครบตามลำดับ แล้วทำแบบทดสอบเพื่อรับเกียรติบัตร</p>
    </div>
    <div id="body"></div>
  </main>
</div>

<div class="modal-bg" id="examModal"><div class="modal-box wide" id="examModalBody"></div></div>
<div class="modal-bg" id="resultModal"><div class="modal-box" id="resultModalBody"></div></div>

<script src="js/student.js"></script>
</body>
</html>
