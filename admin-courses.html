<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>หลักสูตรการอบรม – NP-LearnLab</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="shared/styles.css" rel="stylesheet">
<script src="https://unpkg.com/lucide@1.24.0"></script>
<style>
  .add-row{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
  .add-row input{flex:2;min-width:220px;}
</style>
</head>
<body>

<div id="loadingOverlay"><div class="spinner"></div><p style="color:var(--text2);font-size:14px;font-weight:700;">กำลังตรวจสอบสิทธิ์...</p></div>
<script>if(sessionStorage.getItem("nplab_profile")){document.getElementById("loadingOverlay").classList.add("hide");}</script>
<div id="toast"></div>

<div class="navbar dark"><div class="navbar-inner">
  <div class="navbar-brand">
    <button class="navbar-menu-btn" id="navMenuBtn" title="เมนู" onclick="toggleSidebar(event)"><i data-lucide="menu" style="width:18px;height:18px"></i></button>
    <div class="navbar-mark"><i data-lucide="shield-check" style="width:20px;height:20px"></i></div>
    <div><div class="navbar-title">NP-LearnLab</div><div class="navbar-subtitle">เจ้าหน้าที่</div></div>
  </div>
  <div class="navbar-user" id="navbarUser"><span id="userLabel"></span><img id="userAvatar" class="navbar-avatar" alt="บัญชีผู้ใช้"><button class="navbar-logout" onclick="signOutUser()" title="ออกจากระบบ"><i data-lucide="log-out" style="width:16px;height:16px"></i></button></div>
</div></div>

<div id="sidebarOverlay" onclick="closeSidebar()"></div>
<div class="shell">
  <div class="sidebar" id="sidebar"></div>
  <script>try{if(localStorage.getItem('nplab_sidebar_collapsed')==='1')document.getElementById('sidebar').classList.add('collapsed');}catch(e){}</script>
  <div class="content">
    <div class="page-header">
      <div class="page-title">หลักสูตรการอบรม <span id="courseCount" style="font-size:13px;font-weight:700;color:var(--text3);"></span></div>
      <div class="page-sub">หลักสูตรทั้งหมดในระบบ — เจ้าหน้าที่สามารถแก้ไข/เปลี่ยนสถานะหลักสูตรของผู้สร้างทุกคนได้</div>
    </div>

    <div class="add-row">
      <input id="searchInput" placeholder="ค้นหาชื่อหลักสูตร / ผู้สร้าง..." oninput="renderCourseTable()">
    </div>

    <div class="card" style="padding:0;overflow-x:auto;">
      <table>
        <thead><tr><th>ชื่อหลักสูตร</th><th>หมวดหมู่</th><th>ผู้สร้าง</th><th>สถานะ</th><th>ผู้สมัคร</th><th></th></tr></thead>
        <tbody id="courseBody"></tbody>
      </table>
    </div>
    <div id="courseEmpty" class="empty-state" style="display:none;">
      <i data-lucide="inbox" style="width:32px;height:32px;margin-bottom:8px;"></i>
      <div>ยังไม่มีหลักสูตรในระบบ</div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="shared/firebase-init.js"></script>
<script src="shared/auth-guard.js"></script>
<script src="shared/menu.js"></script>
<script src="js/admin-courses.js"></script>
</body>
</html>
