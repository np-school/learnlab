<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>หลักสูตรการอบรม – NP-LearnLab</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="shared/styles.css" rel="stylesheet">
<script src="https://unpkg.com/lucide@1.24.0"></script>
</head>
<body>

<div id="loadingOverlay"><div class="spinner"></div><p style="color:var(--text2);font-size:14px;font-weight:700;">กำลังตรวจสอบสิทธิ์...</p></div>
<div id="toast"></div>

<div class="navbar dark"><div class="navbar-inner">
  <div class="navbar-brand">
    <button class="navbar-menu-btn" id="navMenuBtn" title="เมนู" onclick="toggleSidebar(event)"><i data-lucide="menu" style="width:18px;height:18px"></i></button>
    <div class="navbar-mark"><i data-lucide="pen-tool" style="width:20px;height:20px"></i></div>
    <div><div class="navbar-title">NP-LearnLab</div><div class="navbar-subtitle">ผู้สร้างหลักสูตร</div></div>
  </div>
  <div class="navbar-user" id="navbarUser"><span id="userLabel"></span><img id="userAvatar" class="navbar-avatar" alt="บัญชีผู้ใช้"><button class="navbar-logout" onclick="signOutUser()" title="ออกจากระบบ"><i data-lucide="log-out" style="width:16px;height:16px"></i></button></div>
</div></div>
<div class="role-switch" id="roleSwitch"></div>

<div id="sidebarOverlay" onclick="closeSidebar()"></div>
<div class="shell">
  <div class="sidebar" id="sidebar"></div>
  <div class="content" style="max-width:760px;">
    <div class="page-header">
      <div class="page-title" id="pageTitle">สร้างหลักสูตรใหม่</div>
      <div class="page-sub">กรอกข้อมูลพื้นฐานของหลักสูตร — รายละเอียดเนื้อหา/บทเรียนจะเพิ่มในภายหลัง</div>
    </div>

    <div class="form-section">
      <div class="form-section-title"><i data-lucide="book-open" style="width:17px;height:17px;color:var(--accent)"></i>ข้อมูลหลักสูตร</div>
      <div class="form-grid">
        <div class="field full"><label>ชื่อหลักสูตร <span class="req">*</span></label><input id="cTitle" placeholder="เช่น การใช้ Google Workspace เพื่อการสอน"></div>
        <div class="field full"><label>คำอธิบายหลักสูตร</label><textarea id="cDesc" rows="3" placeholder="อธิบายภาพรวมหลักสูตรโดยย่อ"></textarea></div>
        <div class="field"><label>หมวดหมู่</label><input id="cCategory" placeholder="เช่น เทคโนโลยี, การสอน"></div>
        <div class="field">
          <label>สถานะ</label>
          <select id="cStatus">
            <option value="draft">ฉบับร่าง (ยังไม่แสดงให้ผู้เรียน)</option>
            <option value="published">เปิดใช้งาน (แสดงในรายการหลักสูตรทั้งหมด)</option>
          </select>
        </div>
      </div>
      <button class="btn-primary" style="margin-top:18px;" onclick="saveCourse()"><i data-lucide="save" style="width:15px;height:15px"></i>บันทึกหลักสูตร</button>
    </div>

    <div class="hint" style="margin-top:14px;">หมายเหตุ: ระบบจัดการบทเรียน เนื้อหา และแบบทดสอบภายในหลักสูตรจะเพิ่มในเวอร์ชันถัดไป</div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="shared/firebase-init.js"></script>
<script src="shared/auth-guard.js"></script>
<script src="shared/menu.js"></script>
<script src="js/course-manage.js"></script>
</body>
</html>
