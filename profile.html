<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ข้อมูลส่วนตัว – NP-LearnLab</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="shared/styles.css" rel="stylesheet">
<script src="https://unpkg.com/lucide@1.24.0"></script>
</head>
<body>

<div id="loadingOverlay"><div class="spinner"></div><p style="color:var(--text2);font-size:14px;font-weight:700;">กำลังตรวจสอบสิทธิ์...</p></div>
<script>if(sessionStorage.getItem("nplab_profile")){document.getElementById("loadingOverlay").classList.add("hide");}</script>
<div id="toast"></div>

<div class="navbar blue"><div class="navbar-inner">
  <div class="navbar-brand">
    <button class="navbar-menu-btn" id="navMenuBtn" title="เมนู" onclick="toggleSidebar(event)"><i data-lucide="menu" style="width:18px;height:18px"></i></button>
    <div class="navbar-mark"><i data-lucide="graduation-cap" style="width:20px;height:20px"></i></div>
    <div><div class="navbar-title">NP-LearnLab</div><div class="navbar-subtitle">ผู้ใช้ทั่วไป</div></div>
  </div>
  <div class="navbar-user" id="navbarUser"><span id="userLabel"></span><img id="userAvatar" class="navbar-avatar" alt="บัญชีผู้ใช้"><button class="navbar-logout" onclick="signOutUser()" title="ออกจากระบบ"><i data-lucide="log-out" style="width:16px;height:16px"></i></button></div>
</div></div>
<div class="role-switch" id="roleSwitch"></div>

<div id="sidebarOverlay" onclick="closeSidebar()"></div>
<div class="shell">
  <div class="sidebar" id="sidebar"></div>
  <div class="content" style="max-width:640px;">
    <div class="page-header">
      <div class="page-title">ข้อมูลส่วนตัว</div>
      <div class="page-sub">แก้ไขข้อมูลที่ใช้แสดงบนเกียรติบัตรและประวัติการอบรม</div>
    </div>

    <div class="form-section">
      <div class="form-section-title"><i data-lucide="user-circle" style="width:17px;height:17px;color:var(--accent)"></i>ข้อมูลบัญชี</div>
      <div class="form-grid">
        <div class="field"><label>อีเมล</label><input id="fEmail" disabled></div>
        <div class="field"><label>ชื่อ-นามสกุล <span class="req">*</span></label><input id="fName"></div>
        <div class="field"><label>เบอร์โทรศัพท์</label><input id="fPhone"></div>
        <div class="field"><label>หน่วยงาน / โรงเรียน</label><input id="fOrg"></div>
        <div class="field"><label>ตำแหน่ง</label><input id="fPosition"></div>
      </div>
      <button class="btn-primary" style="margin-top:18px;" onclick="saveProfile()"><i data-lucide="save" style="width:15px;height:15px"></i>บันทึกการเปลี่ยนแปลง</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="shared/firebase-init.js"></script>
<script src="shared/auth-guard.js"></script>
<script src="shared/menu.js"></script>
<script src="js/profile.js"></script>
</body>
</html>
