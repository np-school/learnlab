<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>หลักสูตรการอบรมทั้งหมด – NP-LearnLab</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="shared/styles.css" rel="stylesheet">
<script src="https://unpkg.com/lucide@1.24.0"></script>
<style>
  .search-row{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap;}
  .search-row input{flex:1;min-width:220px;}
</style>
</head>
<body>

<div id="loadingOverlay"><div class="spinner"></div><p style="color:var(--text2);font-size:14px;font-weight:700;">กำลังตรวจสอบสิทธิ์...</p></div>
<script>if(sessionStorage.getItem("nplab_profile")){document.getElementById("loadingOverlay").classList.add("hide");}</script>
<div id="toast"></div>

<div class="navbar blue"><div class="navbar-inner">
  <div class="navbar-brand">
    <button class="navbar-menu-btn" id="navMenuBtn" title="เมนู" onclick="toggleSidebar(event)"><i data-lucide="menu" style="width:18px;height:18px"></i></button>
    <div class="navbar-mark"><i data-lucide="graduation-cap" style="width:20px;height:20px"></i></div>
    <div><div class="navbar-title">NP-LearnLab</div><div class="navbar-subtitle">ผู้ใช้ทั่วไป</div></div>
  </div>
  <div class="navbar-user" id="navbarUser"><span id="userLabel"></span><img id="userAvatar" class="navbar-avatar" alt="บัญชีผู้ใช้"><button class="navbar-logout" onclick="signOutUser()" title="ออกจากระบบ"><i data-lucide="log-out" style="width:16px;height:16px"></i></button></div>
</div></div>
<div class="role-switch" id="roleSwitch"></div>

<div id="sidebarOverlay" onclick="closeSidebar()"></div>
<div class="shell">
  <div class="sidebar" id="sidebar"></div>
  <div class="content">
    <div class="page-header">
      <div class="page-title">หลักสูตรการอบรมทั้งหมด</div>
      <div class="page-sub">เลือกหลักสูตรที่เปิดรับสมัครและเริ่มเรียนได้ทันที</div>
    </div>

    <div class="search-row">
      <input id="searchInput" placeholder="ค้นหาชื่อหลักสูตร..." oninput="renderCourses()">
    </div>

    <div class="course-grid" id="courseGrid"></div>
    <div id="courseEmpty" class="empty-state" style="display:none;">
      <i data-lucide="inbox" style="width:32px;height:32px;margin-bottom:8px;"></i>
      <div>ยังไม่มีหลักสูตรเปิดรับสมัครในขณะนี้</div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="shared/firebase-init.js"></script>
<script src="shared/auth-guard.js"></script>
<script src="shared/menu.js"></script>
<script src="js/courses.js"></script>
</body>
</html>
